<!doctype html><html><head><meta charset="utf-8"><title>Tree atlas bake</title><style>body{background:#222;color:white;font:16px sans-serif}canvas{height:650px}a{display:block;color:#adf}</style></head><body><h1>Original tree model: elevation atlas</h1><p id="status">Baking…</p><script type="module">
import * as T from '../dist/vendor/three.module.js';import {GLTFLoader} from '../dist/vendor/GLTFLoader.js';
const renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setSize(512,2048);renderer.setPixelRatio(1);renderer.setClearColor(0,0);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const scene=new T.Scene(),source=(await new GLTFLoader().loadAsync('../dist/assets/trees/broadleaf.glb')).scene;source.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(source),size=bounds.getSize(new T.Vector3()),center=bounds.getCenter(new T.Vector3()),tree=new T.Group();source.position.set(-center.x,-bounds.min.y,-center.z);tree.add(source);tree.scale.setScalar(1/size.y);scene.add(tree,new T.HemisphereLight('#e8eef1','#737b57',2));const sun=new T.DirectionalLight('#fff1da',2.5);sun.position.set(-3,5,4);scene.add(sun);const camera=new T.OrthographicCamera(-.64,.64,.6,-.6,.1,20);renderer.autoClear=false;renderer.clear();
for(let row=0;row<4;row++){const angle=row*Math.PI/6;camera.position.set(0,.54+Math.sin(angle)*4,Math.cos(angle)*4);camera.lookAt(0,.54,0);renderer.setViewport(0,row*512,512,512);renderer.setScissor(0,row*512,512,512);renderer.setScissorTest(true);renderer.clear();renderer.render(scene,camera);}
renderer.domElement.toBlob(blob=>{const a=document.createElement('a');a.textContent='Download tree elevation atlas';a.download='broadleaf-elevations.png';a.href=URL.createObjectURL(blob);document.body.append(a);document.getElementById('status').textContent='Four elevations: 0°, 30°, 60°, 90°. Source: existing original tree model.';});
</script></body></html>
