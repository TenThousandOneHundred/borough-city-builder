name: Terrain CPU comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unchanged terrain
        run: node --test tests/road-earthworks-performance.test.mjs tests/road-earthworks.test.mjs tests/terrain-edge-search.test.mjs
      - name: Alternate released and candidate terrain preparation
        run: node tests/terrain-benchmark.mjs
