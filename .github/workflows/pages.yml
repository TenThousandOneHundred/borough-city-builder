name: Publish game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify game engine and modules
        run: |
          node --test tests/progression.test.cjs tests/terrain-partition-index.test.mjs tests/vehicle-model.test.mjs tests/geometry-upload.test.mjs tests/modular-homes.test.mjs tests/road-scenery-staging.test.mjs tests/residential-finishes.test.mjs tests/legacy-road-joins.test.mjs tests/road-build-slices.test.mjs tests/road-build-job.test.mjs tests/landscape-startup.test.mjs tests/road-earthworks-performance.test.mjs tests/road-marking-performance.test.mjs tests/highway-finish.test.mjs tests/highway-ramps.test.mjs tests/highway-barriers.test.mjs tests/road-paint.test.mjs tests/road-shoulders.test.mjs tests/motorway.test.mjs tests/parallel-city-access.test.mjs tests/parallel-tool-interaction.test.mjs tests/road-batch.test.cjs tests/road-connectivity.test.mjs tests/road-curves.test.mjs tests/road-parallel-preview.test.mjs tests/road-parallel.test.mjs tests/transit-stop-rendering.test.mjs tests/road-grid.test.mjs tests/road-grid-interaction.test.mjs tests/road-grid-connectivity.test.mjs tests/economic-tick.test.mjs tests/road-placement.test.mjs tests/road-guide-preview.test.mjs tests/road-tool-interaction.test.mjs tests/bridge-junction-grades.test.mjs tests/road-earthworks-real.test.mjs tests/road-grades.test.mjs tests/road-earthworks.test.mjs tests/road-terrain-integration.test.mjs tests/road-earthworks-refresh.test.mjs tests/bridge-performance.test.mjs tests/road-pavement-performance.test.mjs tests/road-projection-performance.test.mjs tests/road-materials.test.mjs tests/road-profile.test.mjs tests/road-grading.test.mjs tests/road-pavement.test.mjs tests/road-preview-surface.test.mjs tests/road-furniture.test.mjs tests/road-surface-index.test.mjs tests/industrial-surfaces.test.mjs tests/industrial-prop-surfaces.test.mjs tests/industrial-uv.test.mjs tests/industrial-render.test.mjs tests/industrial-yards.test.mjs tests/industrial-models.test.mjs tests/masonry-lod.test.mjs tests/ground-cover-batches.test.mjs tests/ground-cover.test.mjs tests/crossing-control.test.mjs tests/pedestrian-network.test.mjs tests/traffic-following.test.mjs tests/roundabouts.test.mjs tests/tree-canopy.test.mjs tests/private-gardens.test.mjs tests/building-bounds.test.mjs tests/street-terraces.test.mjs tests/road-replacement.test.mjs tests/road-zoning-sides.test.mjs tests/junction-spatial.test.mjs tests/housing-demand.test.mjs tests/intersection-controls.test.mjs tests/apartment-courts.test.mjs tests/zoning-collisions.test.mjs tests/curved-zoning.test.mjs tests/bridges.test.mjs tests/office-facades.test.mjs tests/road-refresh.test.mjs tests/tree-impostor.test.mjs tests/fine-growth.test.mjs tests/fine-travel.test.mjs tests/fine-zoning.test.mjs tests/roadside-zoning.test.mjs tests/joined-zoning.test.mjs tests/office-zoning.test.mjs tests/building-entities.test.mjs tests/engine.test.cjs tests/facilities.test.cjs tests/parcels.test.mjs tests/zoning-layout.test.mjs tests/zoning-render.test.mjs tests/skyline.test.mjs tests/urban.test.mjs tests/street-life.test.mjs tests/rebuild.test.mjs tests/landscape-rebuild.test.mjs tests/water-ripples.test.mjs tests/model-library.test.mjs tests/game-performance.test.mjs tests/traffic.test.mjs tests/traffic-spatial.test.mjs tests/residents.test.mjs tests/junctions.test.mjs tests/simulation-clock.test.mjs tests/terrain-edit.test.mjs tests/street-geometry.test.mjs tests/road-junction-plan.test.mjs tests/transit.test.mjs tests/walking.test.mjs tests/walking-search.test.mjs tests/site-details.test.mjs tests/render-cache.test.mjs tests/asset-transfer.test.mjs tests/architecture-startup.test.mjs tests/lot-access.test.mjs
          for module in dist/*.js; do node --input-type=module --check < "$module"; done
          node --check dist/app.js
          node --check dist/renderer.js
          node --check dist/landscape.js
          node --check dist/architecture.js
          node --check dist/districts.js
          node --check dist/skyline.js
          node --check dist/urban.js
          node --check dist/street-life.js
          node --check dist/terrain-material.js
          node --check dist/graphics.js
          node --check dist/vegetation.js
          node tests/assets.test.cjs
          node scripts/compress-assets.mjs --check
          node --check dist/roadworks.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
