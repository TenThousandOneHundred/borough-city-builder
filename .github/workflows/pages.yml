name: Publish game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify game engine and modules
        run: |
          node --test tests/tree-impostor.test.mjs tests/fine-growth.test.mjs tests/fine-travel.test.mjs tests/fine-zoning.test.mjs tests/roadside-zoning.test.mjs tests/building-entities.test.mjs tests/engine.test.cjs tests/facilities.test.cjs tests/parcels.test.mjs tests/zoning-layout.test.mjs tests/zoning-render.test.mjs tests/skyline.test.mjs tests/urban.test.mjs tests/street-life.test.mjs tests/rebuild.test.mjs tests/landscape-rebuild.test.mjs tests/model-library.test.mjs tests/game-performance.test.mjs tests/traffic.test.mjs tests/traffic-spatial.test.mjs tests/residents.test.mjs tests/junctions.test.mjs tests/simulation-clock.test.mjs tests/terrain-edit.test.mjs tests/street-geometry.test.mjs tests/road-junction-plan.test.mjs tests/transit.test.mjs tests/walking.test.mjs tests/site-details.test.mjs tests/render-cache.test.mjs tests/asset-transfer.test.mjs tests/architecture-startup.test.mjs tests/lot-access.test.mjs
          for module in dist/*.js; do node --input-type=module --check < "$module"; done
          node --check dist/app.js
          node --check dist/renderer.js
          node --check dist/landscape.js
          node --check dist/architecture.js
          node --check dist/districts.js
          node --check dist/skyline.js
          node --check dist/urban.js
          node --check dist/street-life.js
          node --check dist/terrain-material.js
          node --check dist/graphics.js
          node --check dist/vegetation.js
          node tests/assets.test.cjs
          node scripts/compress-assets.mjs --check
          node --check dist/roadworks.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
